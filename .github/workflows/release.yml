# Release of Irios for WooCommerce: pushing a version tag (e.g. `git tag 1.0.6 && git push origin 1.0.6`) runs the tests,
# builds the zip with bin/package.sh and publishes a GitHub Release, with the version's CHANGELOG.md section as release
# notes (bin/release-notes.sh; no section, no release) and two assets:
#   - irios-woocommerce-<version>.zip  (versioned)
#   - irios-woocommerce.zip            (fixed name, so .../releases/latest/download/irios-woocommerce.zip
#                                           always points to the latest version)
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PHPUnit 11 needs PHP 8.2+; PHP 8.1 compatibility is checked by the lint job
        php: ['8.2', '8.4']
    defaults:
      run:
        working-directory: irios-woocommerce
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  lint:
    name: Syntax on PHP 8.1 (minimum supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: find irios-woocommerce -path irios-woocommerce/tests -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  notes:
    name: Release notes in CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/release-notes.sh "$GITHUB_REF_NAME"

  release:
    name: Build and publish
    needs: [test, lint, notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bin/package.sh takes the version from the git tags
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none
      - name: Build the zip
        run: |
          zip_path="$(bin/package.sh | tail -n 1)"
          expected="dist/irios-woocommerce-${GITHUB_REF_NAME}.zip"
          if [[ "$zip_path" != "$PWD/$expected" ]]; then
            echo "The built zip ($zip_path) does not match the tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          cp "$expected" dist/irios-woocommerce.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            "dist/irios-woocommerce-${GITHUB_REF_NAME}.zip" \
            dist/irios-woocommerce.zip \
            --title "Irios for WooCommerce ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
